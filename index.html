<!doctype html>
<html lang="es"><meta charset="utf-8"><title>Disxcel</title>
<style>
@font-face{font-family:AS;src:local("Anthropic Serif Text"),url(fonts/AnthropicSerif-Text-Regular-Static.otf)}
@font-face{font-family:AS;font-style:italic;src:local("Anthropic Serif Text Italic"),url(fonts/AnthropicSerif-Text-RegularItalic-Static.otf)}
@font-face{font-family:AS;font-weight:500;src:local("Anthropic Serif Text Medium"),url(fonts/AnthropicSerif-Text-Medium-Static.otf)}
@font-face{font-family:AS;font-weight:600;src:local("Anthropic Serif Text Semibold"),url(fonts/AnthropicSerif-Text-Semibold-Static.otf)}
@font-face{font-family:AS;font-weight:700;src:local("Anthropic Serif Text Bold"),url(fonts/AnthropicSerif-Text-Bold-Static.otf)}
@font-face{font-family:ASD;font-weight:600;src:local("Anthropic Serif Display Semibold"),url(fonts/AnthropicSerif-Display-Semibold-Static.otf)}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;font:16px AS,Georgia,serif;color:#fff;display:grid;place-items:center;
 background:#1b1340 url(bg.jpg) center/cover fixed}
.glass{position:relative;overflow:hidden;
 background:linear-gradient(135deg,rgba(30,20,50,.55),rgba(30,20,50,.35));
 backdrop-filter:blur(28px) saturate(200%) brightness(.9);-webkit-backdrop-filter:blur(28px) saturate(200%) brightness(.9);
 border:1.5px solid rgba(255,255,255,.55);border-radius:32px;
 box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 2px 2px rgba(255,255,255,.7),inset 0 -2px 6px rgba(255,255,255,.2),inset 0 0 40px rgba(255,255,255,.08);
 animation:float 6s ease-in-out infinite}
.glass::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
 background:radial-gradient(260px circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.35),transparent 60%);transition:background .15s}
.glass::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;pointer-events:none;
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);animation:sheen 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes sheen{0%,60%{left:-60%}100%{left:130%}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.94)}}
main{width:calc(100vw - 32px);height:calc(100vh - 32px);padding:20px;display:flex;flex-direction:column;text-shadow:0 1px 3px rgba(0,0,0,.6)}
main>header{display:flex;align-items:center;gap:8px;margin-bottom:14px}
h1{margin:0 10px 0 0;font:600 2em ASD,AS,Georgia,serif;letter-spacing:-.01em}
button,input{font:inherit;color:inherit}
button{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45);border-radius:14px;padding:6px 12px;cursor:pointer;box-shadow:inset 0 1px 1px rgba(255,255,255,.5);transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .25s,box-shadow .25s}
button:hover{background:rgba(255,255,255,.38);transform:translateY(-2px) scale(1.08);box-shadow:0 6px 16px rgba(0,0,0,.3),inset 0 1px 1px rgba(255,255,255,.7)}
button:active{transform:scale(.9)}
#ref{min-width:60px;text-align:center;padding:6px 12px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.3);font-variant-numeric:tabular-nums}
.sc{flex:1;overflow:auto;border-radius:18px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.25)}
.sc::-webkit-scrollbar{width:8px;height:8px}.sc::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:8px}.sc::-webkit-scrollbar-corner{background:none}
.in{position:relative;width:max-content}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:.92em;user-select:none;-webkit-user-select:none}
td,th{height:30px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:solid rgba(255,255,255,.12);border-width:0 1px 1px 0}
td{width:110px;max-width:110px;cursor:cell}
tr:hover td{background:rgba(255,255,255,.05)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
th{position:sticky;z-index:2;font-weight:500;font-size:.8em;color:rgba(255,255,255,.75);background:rgba(28,18,52,.85);
 transition:background .25s,color .25s,box-shadow .25s,text-shadow .25s}
thead th{top:0}
tbody th{left:0;width:46px;text-align:right}
thead th:first-child{left:0;z-index:3}
th.on{color:#fff;background:rgba(110,90,165,.9);box-shadow:inset 0 0 14px rgba(255,255,255,.35);text-shadow:0 0 10px rgba(255,255,255,.9),0 1px 3px rgba(0,0,0,.6)}
#sel{position:absolute;z-index:1;pointer-events:none;border-radius:8px;border:1.5px solid rgba(255,255,255,.9);background:rgba(255,255,255,.12);
 box-shadow:0 0 18px rgba(255,255,255,.45),inset 0 1px 1px rgba(255,255,255,.7);
 transition:top .28s cubic-bezier(.34,1.56,.64,1),left .28s cubic-bezier(.34,1.56,.64,1),width .28s,height .28s}
#ed{position:absolute;z-index:1;padding:0 8px;border:0;outline:none;font-size:.92em;background:transparent;opacity:0;caret-color:transparent;text-shadow:inherit}
#ed:not(.on){pointer-events:none} /* clicks reach the cell underneath */
#ed.on{opacity:1;caret-color:auto;border-radius:10px;background:rgba(30,20,50,.88);
 box-shadow:0 0 0 2px rgba(255,255,255,.7),0 0 24px rgba(255,255,255,.4),0 8px 20px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
#tabs{display:flex;gap:6px;margin-top:10px;padding:6px 2px 2px;overflow-x:auto}
#tabs button{flex:none;display:flex;align-items:center;gap:6px}
#tabs .pop{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
#tabs .sel,#pst .sel{background:rgba(255,255,255,.42);box-shadow:0 0 16px rgba(255,255,255,.35),inset 0 1px 1px rgba(255,255,255,.8)}
#tabs .x{padding:0 5px;border-radius:8px;font-size:.8em;opacity:.75;transition:background .25s,opacity .25s}
#tabs .x:hover{opacity:1;background:rgba(255,255,255,.25)}
#tabs .x.armed{opacity:1;background:rgba(251,113,133,.6)}
#tabs input{width:140px;padding:6px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.35);outline:none;
 box-shadow:0 0 0 2px rgba(255,255,255,.6),0 0 24px rgba(255,255,255,.35)}
#toast{position:fixed;z-index:10;bottom:28px;left:50%;translate:-50% 20px;opacity:0;padding:10px 18px;border-radius:18px;pointer-events:none;
 text-shadow:0 1px 3px rgba(0,0,0,.6);transition:opacity .35s,translate .45s cubic-bezier(.34,1.56,.64,1)}
#toast.on{opacity:1;translate:-50% 0}
dialog.glass{position:fixed;width:min(560px,92vw);padding:22px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
dialog::backdrop{background:rgba(15,8,40,.35);backdrop-filter:blur(3px)}
#ph h2{margin:0 0 12px;font:600 1.4em ASD,AS,Georgia,serif}
#ph img{display:block;width:100%;max-height:50vh;object-fit:contain;border-radius:14px;background:rgba(0,0,0,.25);box-shadow:0 8px 24px rgba(0,0,0,.35)}
#ph .row{display:flex;gap:8px;margin-top:16px}
#pst{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
html.idle *,html.idle *::before,html.idle *::after{animation-play-state:paused!important} /* no frames while nobody is looking */
</style>
<main class="glass">
<header><h1>Disxcel</h1><span id=ref>A1</span><span style=flex:1></span>
 <button id=op title="Abrir .xlsx, .ods o .csv (cada hoja entra como pestaña nueva)">📂 Abrir</button><input type=file id=fi accept=".xlsx,.xls,.ods,.csv" hidden>
 <button id=xc title="Exportar la hoja actual">⬇ CSV</button><button id=xx title="Exportar todas las hojas a Excel 97–2003">⬇ .xls</button><button id=sh title="Guardar la hoja como imagen">📷 Foto</button></header>
<div class=sc id=sc><div class=in>
 <table><thead id=hd></thead><tbody id=tb></tbody></table>
 <div id=sel></div><input id=ed autocomplete=off spellcheck=false>
</div></div>
<nav id=tabs></nav>
</main>
<div id=toast class=glass></div>
<dialog id=ph class=glass><h2>Exportar como foto</h2><nav id=pst></nav><img id=pv alt="Vista previa">
 <div class=row><button id=pc>Cancelar</button><span style=flex:1></span><button id=pp>⬇ PNG</button><button id=pj>⬇ JPG</button></div></dialog>
<script src="xlsx.full.min.js"></script>
<script>
const $=i=>document.getElementById(i),tb=$('tb'),ed=$('ed'),sc=$('sc');
const COLS=26,col=c=>String.fromCharCode(65+c),key=(r,c)=>col(c)+(r+1);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const plain=v=>v&&typeof v=='object'&&!Array.isArray(v);
const clean=b=>{b={active:+b?.active||0,sheets:(plain(b)&&Array.isArray(b.sheets)?b.sheets:[]).filter(plain).map((s,i)=>({name:String(s.name||'Hoja '+(i+1)),
 cells:Object.fromEntries(Object.entries(plain(s.cells)?s.cells:{}).filter(([k,v])=>/^[A-Z][1-9]\d*$/.test(k)&&v!=null&&v!=='').map(([k,v])=>[k,String(v)]))}))};
 if(!b.sheets.length)b.sheets.push({name:'Hoja 1',cells:{}});
 b.active=clamp(b.active,0,b.sheets.length-1);return b};
let wb=null;try{wb=JSON.parse(window.__book??'null')}catch{} // the launcher injects book.json (and keeps an unreadable one as book.json.corrupt)
wb=clean(wb);
const save=()=>window.webkit?.messageHandlers?.book?.postMessage(JSON.stringify(wb)),sheet=()=>wb.sheets[wb.active];
const uniq=(n,skip)=>{let v=n;for(let k=2;wb.sheets.some((s,j)=>j!==skip&&s.name==v);k++)v=n+' ('+k+')';return v};
const isNum=v=>/^[-+]?[\d.,]*\d[\d.,]*%?$/.test(v.trim());
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),4000)};

$('hd').innerHTML='<tr><th></th>'+[...Array(COLS)].map((_,c)=>`<th>${col(c)}</th>`).join('')+'</tr>';
const cell=(r,c)=>tb.rows[r].cells[c+1];
const rowHtml=(r,cells)=>`<tr><th>${r+1}</th>`+[...Array(COLS)].map((_,c)=>{const v=cells[key(r,c)]||'';return`<td${isNum(v)?' class=num':''}>${esc(v)}</td>`}).join('')+'</tr>';
const grow=n=>tb.insertAdjacentHTML('beforeend',[...Array(n)].map((_,i)=>rowHtml(tb.rows.length+i,{})).join(''));
let R=0,C=0,mode=null; // mode: null = just selected, 'type' = typing replaced the cell, 'edit' = F2/double click (arrows move the caret)
function render(anim){ // ponytail: every row is real DOM; fine to tens of thousands of cells, virtualise if huge sheets get slow
 const s=sheet(),n=Math.max(200,...Object.keys(s.cells).map(k=>+k.slice(1)+20));
 tb.innerHTML=[...Array(n)].map((_,r)=>rowHtml(r,s.cells)).join('');
 R=Math.min(R,n-1);place();renderTabs();
 if(anim)tb.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:400,easing:'cubic-bezier(.34,1.56,.64,1)'})}
function place(){const td=cell(R,C),box={top:td.offsetTop+'px',left:td.offsetLeft+'px',width:td.offsetWidth+'px',height:td.offsetHeight+'px'};
 Object.assign($('sel').style,box);if(!mode)Object.assign(ed.style,box);
 const hT=$('hd').offsetHeight,hL=tb.rows[0].cells[0].offsetWidth; // keep the cell clear of the sticky headers
 if(td.offsetTop-hT<sc.scrollTop)sc.scrollTop=td.offsetTop-hT;else if(td.offsetTop+td.offsetHeight>sc.scrollTop+sc.clientHeight)sc.scrollTop=td.offsetTop+td.offsetHeight-sc.clientHeight;
 if(td.offsetLeft-hL<sc.scrollLeft)sc.scrollLeft=td.offsetLeft-hL;else if(td.offsetLeft+td.offsetWidth>sc.scrollLeft+sc.clientWidth)sc.scrollLeft=td.offsetLeft+td.offsetWidth-sc.clientWidth;
 document.querySelectorAll('th.on').forEach(t=>t.classList.remove('on'));
 $('hd').rows[0].cells[C+1].classList.add('on');tb.rows[R].cells[0].classList.add('on');
 $('ref').textContent=key(R,C)}
const move=(dr,dc)=>{R=Math.max(0,R+dr);C=clamp(C+dc,0,COLS-1);if(R>=tb.rows.length-1)grow(50);place()};
function setCell(r,c,v){const s=sheet(),k=key(r,c);if(v==='')delete s.cells[k];else s.cells[k]=v;
 const td=cell(r,c);td.textContent=v;td.classList.toggle('num',isNum(v));save()}
const refocus=()=>ed.focus({preventScroll:true});
const fit=()=>{const w=cell(R,C).offsetWidth;ed.style.width=w+'px';if(ed.scrollWidth>ed.clientWidth)ed.style.width=Math.min(ed.scrollWidth+16,480)+'px'};
function startEdit(m,v){mode=m;if(v!=null){ed.value=v;ed.setSelectionRange(v.length,v.length)}ed.classList.add('on');fit()}
function stopEdit(commit){if(!mode)return;if(commit)setCell(R,C,ed.value);mode=null;ed.value='';ed.classList.remove('on');place()}
ed.oninput=()=>{if(!mode)startEdit('type');fit()}; // the always-focused editor catches typing, so dead keys and IME work
ed.onblur=()=>stopEdit(true);
ed.onkeydown=e=>{if(e.isComposing)return;
 const nav={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key],b=e.shiftKey?-1:1;
 if(e.key=='Enter'||e.key=='Tab'){e.preventDefault();stopEdit(true);e.key=='Enter'?move(b,0):move(0,b)}
 else if(e.key=='Escape'){if(mode){e.preventDefault();stopEdit(false)}}
 else if(nav&&mode!='edit'){e.preventDefault();stopEdit(true);move(...nav)}
 else if(!mode&&e.key=='F2'){e.preventDefault();startEdit('edit',sheet().cells[key(R,C)]||'')}
 else if(!mode&&(e.key=='Delete'||e.key=='Backspace')){e.preventDefault();setCell(R,C,'')}};
ed.oncopy=ed.oncut=e=>{if(mode)return;e.preventDefault();e.clipboardData.setData('text/plain',sheet().cells[key(R,C)]||'');if(e.type=='cut')setCell(R,C,'')};
ed.onpaste=e=>{const t=e.clipboardData.getData('text/plain').replace(/\r/g,'').replace(/\n$/,'');
 if(mode&&!/[\t\n]/.test(t))return; // plain text inside a cell being edited
 e.preventDefault();stopEdit(false);paste(t)};
function paste(t){let cut=0;const s=sheet(); // tab/newline separated, as Excel and browsers copy cell ranges
 t.split('\n').forEach((line,i)=>line.split('\t').forEach((v,j)=>{if(C+j>=COLS){cut++;return}const k=key(R+i,C+j);v=v.trim();if(v)s.cells[k]=v;else delete s.cells[k]}));
 save();render();if(cut)toast(`Solo caben 26 columnas (A–Z): ${cut} celdas quedaron fuera`)}
tb.onpointerdown=e=>{const td=e.target.closest('td');if(!td||e.button)return;e.preventDefault();
 stopEdit(true);R=td.parentNode.sectionRowIndex;C=td.cellIndex-1;place();refocus()};
tb.ondblclick=e=>{if(e.target.closest('td'))startEdit('edit',sheet().cells[key(R,C)]||'')};
addEventListener('pointerup',()=>{if(document.activeElement==document.body)refocus()}); // clicks on headers/scrollbars must not strand the keyboard

function renderTabs(pop){
 $('tabs').innerHTML=wb.sheets.map((s,i)=>`<button data-i=${i} class="${i==wb.active?'sel':''} ${i==pop?'pop':''}" title="Doble clic para renombrar">${esc(s.name)}`+
  (i==wb.active&&wb.sheets.length>1?'<span class=x title="Borrar hoja">✕</span>':'')+'</button>').join('')+'<button id=add title="Nueva hoja">＋</button>'}
const open=i=>{stopEdit(true);wb.active=i;R=C=0;save();render(true);renderTabs(i);refocus()};
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id=='add'){wb.sheets.push({name:uniq('Hoja '+(wb.sheets.length+1)),cells:{}});return open(wb.sheets.length-1)}
 const i=+b.dataset.i,x=e.target.closest('.x');
 if(x&&!x.classList.contains('armed')){x.classList.add('armed');x.textContent='¿Borrar?';
  setTimeout(()=>{if(x.isConnected&&!$('tabs').querySelector('input'))renderTabs()},3000);return} // second click within 3 s deletes
 if(x){wb.sheets.splice(i,1);return open(Math.min(i,wb.sheets.length-1))}
 if(i!=wb.active)open(i);else refocus()};
$('tabs').ondblclick=e=>{const b=e.target.closest('button[data-i]');if(!b||e.target.closest('.x'))return;
 const i=+b.dataset.i,inp=document.createElement('input');inp.value=wb.sheets[i].name;b.replaceWith(inp);inp.focus();inp.select();
 let done=false;const end=ok=>{if(done)return;done=true;const v=inp.value.trim();if(ok&&v)wb.sheets[i].name=uniq(v,i);save();renderTabs();refocus()};
 inp.onkeydown=e=>{if(e.key=='Enter')end(true);if(e.key=='Escape')end(false)};inp.onblur=()=>end(true)};

$('op').onclick=()=>$('fi').click();
$('fi').onchange=async()=>{const f=$('fi').files[0];$('fi').value='';if(!f)return;
 try{const x=/\.csv$/i.test(f.name)?XLSX.read(await f.text(),{type:'string'}):XLSX.read(await f.arrayBuffer()),first=wb.sheets.length;let cut=0;
  for(const n of x.SheetNames){const ws=x.Sheets[n],cells={},o=ws['!ref']?XLSX.utils.decode_range(ws['!ref']).s:{r:0,c:0};
   XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:'',blankrows:true}).forEach((row,r)=>row.forEach((v,c)=>{
    v=String(v);if(!v)return;if(o.c+c>=COLS){cut++;return}cells[key(o.r+r,o.c+c)]=v}));
   wb.sheets.push({name:uniq(/\.csv$/i.test(f.name)?f.name.replace(/\.csv$/i,''):n),cells})}
  if(wb.sheets.length==first)throw 0;
  open(first);if(cut)toast(`Solo caben 26 columnas (A–Z): ${cut} celdas no se importaron`)}
 catch(err){console.error(err);toast('No se pudo abrir '+f.name)}};
const aoa=(s,typed)=>{const a=[];for(const[k,v]of Object.entries(s.cells))(a[+k.slice(1)-1]??=[])[k.charCodeAt(0)-65]=typed&&/^-?(0|[1-9]\d*)(\.\d+)?$/.test(v)?+v:v;
 return Array.from(a,row=>Array.from(row??[],v=>v??''))};
const dl=(name,data,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()};
$('xc').onclick=()=>{stopEdit(true);dl(sheet().name.replace(/[\/\\]/g,'_')+'.csv','﻿'+XLSX.utils.sheet_to_csv(XLSX.utils.aoa_to_sheet(aoa(sheet()))),'text/csv');refocus()}; // BOM: Excel reads the accents as UTF-8
$('xx').onclick=()=>{stopEdit(true);const b=XLSX.utils.book_new();
 for(const s of wb.sheets){const base=s.name.replace(/[\[\]:*?\/\\]/g,'_').slice(0,31);let n=base; // xlsx sheet names: 31 chars, unique ignoring case
  for(let k=2;b.SheetNames.some(x=>x.toLowerCase()==n.toLowerCase());k++)n=base.slice(0,26)+' ('+k+')';
  XLSX.utils.book_append_sheet(b,XLSX.utils.aoa_to_sheet(aoa(s,true)),n)}
 dl('disxcel.xls',XLSX.write(b,{type:'array',bookType:'biff8'}),'application/vnd.ms-excel');refocus()};
const bg=Object.assign(new Image(),{src:'bg.jpg'});
const SERIF='AS,Georgia,serif',SANS='Ubuntu,"Segoe UI",Arial,sans-serif';
const STYLES={ // photo looks; labels = A B C / 1 2 3 like the grid, head1 = the first row is a header
 normal:{name:'Normal',font:SERIF,labels:true,bg:'#ffffff',text:'#1f1f1f',head:'#f2f2f2',headText:'#5f5f5f',grid:'#dadada',border:'#bdbdbd',title:'#1f1f1f',radius:0},
 glass:{name:'Liquid glass',font:SERIF,labels:true,glass:true,panel:'rgba(0,0,0,.22)',text:'#fff',head:'rgba(28,18,52,.85)',headText:'rgba(255,255,255,.75)',grid:'rgba(255,255,255,.12)',border:'rgba(255,255,255,.55)',title:'#fff',radius:16},
 corp:{name:'Corporativo',font:SANS,head1:true,bg:'#ffffff',text:'#1d2733',head:'#1f3a5f',headText:'#ffffff',zebra:'#f3f6fa',grid:'#e1e7ef',border:'#1f3a5f',title:'#1f3a5f',radius:8},
 dark:{name:'Oscuro',font:SANS,head1:true,bg:'#0e1014',panel:'#161920',text:'#e6e8ec',head:'#20242e',headText:'#e3c25c',zebra:'#1a1e26',grid:'#2a2f3a',border:'#2a2f3a',title:'#ffffff',radius:14},
 minimal:{name:'Minimal',font:SERIF,head1:true,bg:'#fbfaf7',text:'#222222',headText:'#111111',grid:'#e6e1d6',rule:'#222222',vlines:false,title:'#111111',radius:0},
};
async function photo(st){ // the used area of the sheet as an image in one of STYLES
 const S=STYLES[st]||STYLES.normal,s=sheet(),ks=Object.keys(s.cells);if(!ks.length)return null;
 await document.fonts.ready;await bg.decode().catch(()=>{});
 const nr=Math.max(...ks.map(k=>+k.slice(1))),nc=Math.max(...ks.map(k=>k.charCodeAt(0)-65))+1,F='15px '+S.font,FB='600 15px '+S.font;
 const cv=document.createElement('canvas'),x=cv.getContext('2d');
 const ws=[...Array(nc)].map((_,c)=>clamp(Math.max(...[...Array(nr)].map((_,r)=>{x.font=S.head1&&!r?FB:F;return x.measureText(s.cells[key(r,c)]||'').width}))+20,60,360));
 const wrap=(v,w)=>v.split('\n').flatMap(par=>{const out=[];let ln=''; // greedy word wrap; a word wider than the column is cut by letters
  for(const word of par.split(/(?<=\s)/)){const t=ln+word;if(!ln||x.measureText(t.trimEnd()).width<=w){ln=t;continue}out.push(ln.trimEnd());ln=word}
  out.push(ln.trimEnd());return out.flatMap(l=>{const r=[];let c='';for(const ch of l){if(c&&x.measureText(c+ch).width>w){r.push(c);c=''}c+=ch}r.push(c);return r})});
 const LH=20,txt=[...Array(nr)].map((_,r)=>ws.map((w,c)=>{x.font=S.head1&&!r?FB:F;return wrap(s.cells[key(r,c)]||'',w-20)})); // every cell's lines
 const L=S.labels,top=L?1:0,P=28,T=56,H=32,HW=L?46:0,rh=txt.map(row=>Math.max(H,...row.map(l=>l.length*LH+12)));
 const W=P*2+HW+ws.reduce((a,b)=>a+b,0),Ht=P*2+T+H*top+rh.reduce((a,b)=>a+b,0);
 const k=Math.min(2,8000/Math.max(W,Ht)); // ponytail: very big sheets get a smaller scale; split into pages if that gets unreadable
 cv.width=W*k;cv.height=Ht*k;x.scale(k,k);
 if(S.glass){
  const cover=(c,w,h,m=0)=>{const r=Math.max((w+2*m)/bg.width,(h+2*m)/bg.height)||0;c.fillStyle='#1b1340';c.fillRect(0,0,w,h);
   if(r)c.drawImage(bg,(w-bg.width*r)/2,(h-bg.height*r)/2,bg.width*r,bg.height*r)}; // m: bleed so the blur has no dark edges
  if('filter' in x){x.filter='blur(28px) saturate(200%) brightness(.9)';cover(x,W,Ht,60);x.filter='none'} // same recipe as .glass
  else{let c=document.createElement('canvas');c.width=W;c.height=Ht;cover(c.getContext('2d'),W,Ht); // WebKitGTK has no canvas filter:
   const step=(f,w,h)=>{const n=document.createElement('canvas');n.width=Math.max(1,Math.round(w));n.height=Math.max(1,Math.round(h));
    const nx=n.getContext('2d');nx.imageSmoothingQuality='high';nx.drawImage(f,0,0,n.width,n.height);return n};
   for(let d=2;d<=32;d*=2)c=step(c,W/d,Ht/d);for(let d=16;d>=1;d/=2)c=step(c,W/d,Ht/d); // halve 5 times, double back = smooth blur
   x.drawImage(c,0,0,W,Ht)}
  x.fillStyle='rgba(30,20,50,.45)';x.fillRect(0,0,W,Ht)}
 else{x.fillStyle=S.bg;x.fillRect(0,0,W,Ht)}
 const g0=P+T,gx=P,gw=W-P*2,gh=Ht-P*2-T,ys=rh.reduce((a,h)=>[...a,a.at(-1)+h],[g0+H*top]),y=i=>ys[i]; // y(i): top of data row i
 x.save();x.beginPath();x.roundRect(gx,g0,gw,gh,S.radius);x.clip();
 x.fillStyle=S.panel||S.bg;x.fillRect(gx,g0,gw,gh);
 if(S.zebra){x.fillStyle=S.zebra;for(let i=S.head1?2:1;i<nr;i+=2)x.fillRect(gx,y(i),gw,rh[i])}
 if(S.head){x.fillStyle=S.head;if(L){x.fillRect(gx,g0,gw,H);x.fillRect(gx,g0,HW,gh)}else x.fillRect(gx,g0,gw,rh[0])}
 x.strokeStyle=S.grid;x.lineWidth=1;x.beginPath();
 for(let i=top?0:1;i<nr;i++){x.moveTo(gx,y(i)+.5);x.lineTo(gx+gw,y(i)+.5)}
 if(S.vlines!==false){let cx=gx+HW;ws.forEach((w,c)=>{if(c||L){x.moveTo(cx+.5,g0);x.lineTo(cx+.5,g0+gh)}cx+=w})}
 x.stroke();x.restore();
 if(S.rule){x.fillStyle=S.rule;x.fillRect(gx,g0,gw,2);x.fillRect(gx,y(1)-1,gw,1.5);x.fillRect(gx,g0+gh-2,gw,2)} // book-style rules

 if(S.glass){x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=3;x.shadowOffsetY=1}
 x.textBaseline='middle';x.textAlign='left';x.fillStyle=S.title;x.font='600 28px '+(S.font==SERIF?'ASD,':'')+S.font;x.fillText(s.name,P,P+T/2-6);
 if(L){x.font='500 12px '+S.font;x.fillStyle=S.headText;x.textAlign='center';let cx=gx+HW;ws.forEach((w,c)=>{x.fillText(col(c),cx+w/2,g0+H/2);cx+=w});
  x.textAlign='right';for(let i=0;i<nr;i++)x.fillText(i+1,gx+HW-8,y(i)+rh[i]/2)}
 for(let i=0;i<nr;i++){const hd=S.head1&&!i;x.font=hd?FB:F;x.fillStyle=hd?S.headText:S.text;let cx=gx+HW;
  ws.forEach((w,c)=>{const v=s.cells[key(i,c)],ls=txt[i][c],t0=y(i)+(rh[i]-ls.length*LH)/2+LH/2; // lines centred in the row
   if(v){const n=!hd&&isNum(v);x.textAlign=n?'right':'left';ls.forEach((l,j)=>x.fillText(l,n?cx+w-10:cx+10,t0+j*LH))}cx+=w})}
 return cv}
let shotCv=null,shotN=0;
$('pst').innerHTML=Object.entries(STYLES).map(([k,v])=>`<button data-s=${k}>${v.name}</button>`).join('');
async function preview(st){const n=++shotN; // fast clicks: only the last style asked for wins
 document.querySelectorAll('#pst button').forEach(b=>b.classList.toggle('sel',b.dataset.s==st));
 const cv=await photo(st);if(n!=shotN)return;shotCv=cv;$('pv').src=cv.toDataURL()}
$('pst').onclick=e=>{const b=e.target.closest('button');if(b)preview(b.dataset.s)};
$('sh').onclick=async()=>{stopEdit(true);if(!Object.keys(sheet().cells).length){toast('La hoja está vacía');return refocus()}
 await preview('normal');$('ph').showModal()}; // every popup starts on Normal
const savePhoto=(t,ext)=>{shotCv.toBlob(b=>dl(sheet().name.replace(/[\/\\]/g,'_')+'.'+ext,b,t),t,.92);$('ph').close()};
$('pp').onclick=()=>savePhoto('image/png','png');$('pj').onclick=()=>savePhoto('image/jpeg','jpg');
$('pc').onclick=()=>$('ph').close();$('ph').onclose=refocus;

render();refocus();

let idleT; // pause the endless animations after 20 s without input or when unfocused: every frame costs a leaked fd
const wake=()=>{document.documentElement.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.documentElement.classList.add('idle'),20000)};
['pointermove','pointerdown','keydown','focus'].forEach(t=>addEventListener(t,wake,true));
addEventListener('blur',()=>{clearTimeout(idleT);document.documentElement.classList.add('idle')});
document.addEventListener('visibilitychange',()=>document.hidden?document.documentElement.classList.add('idle'):wake());
